<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NaijaMarket – Buy & Sell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f5f5f5; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; min-height: 100vh; background: white; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    header { background: #0a7c2b; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; position: sticky; top: 0; z-index: 10; }
    .tabs { display: flex; border-bottom: 1px solid #ddd; background: white; }
    .tab { flex: 1; padding: 12px; text-align: center; font-weight: bold; cursor: pointer; color: #666; transition: 0.2s; }
    .tab.active { color: #0a7c2b; border-bottom: 3px solid #0a7c2b; background: #f0fff0; }
    .page { display: none; padding: 15px; padding-bottom: 70px; }
    .page.active { display: block; }
    .listing { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .listing-info h3 { margin-bottom: 5px; color: #333; }
    .listing-info p { color: #666; font-size: 0.9rem; }
    .buy-btn { background: #0a7c2b; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .buy-btn:disabled { background: #aaa; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    .btn { background: #0a7c2b; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn:disabled { opacity: 0.6; }
    .profile-card { text-align: center; padding: 20px; background: #f0fff0; border-radius: 15px; }
    .profile-card img { width: 80px; height: 80px; border-radius: 50%; background: #ddd; }
    .stars { color: gold; font-size: 1.2rem; }
    .message-bubble { max-width: 80%; margin: 5px; padding: 10px 15px; border-radius: 20px; clear: both; word-wrap: break-word; }
    .message-sent { background: #0a7c2b; color: white; float: right; }
    .message-received { background: #e0e0e0; float: left; }
    .chat-input { display: flex; position: sticky; bottom: 0; background: white; padding: 10px; border-top: 1px solid #ddd; }
    .chat-input input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; }
    .chat-input button { margin-left: 10px; background: #0a7c2b; color: white; border: none; border-radius: 20px; padding: 10px 20px; }
  </style>
</head>
<body>
<div class="app">
  <header>🛒 NaijaMarket</header>
  <div class="tabs">
    <div class="tab active" data-page="home">Home</div>
    <div class="tab" data-page="sell">Sell</div>
    <div class="tab" data-page="messages">Chats</div>
    <div class="tab" data-page="profile">Profile</div>
  </div>

  <!-- Home Page -->
  <div id="home" class="page active"></div>

  <!-- Sell Page -->
  <div id="sell" class="page">
    <h3>Post a Listing (₦100 fee)</h3>
    <div class="form-group"><label>Item Title</label><input id="itemTitle" placeholder="e.g. Used iPhone 12"></div>
    <div class="form-group"><label>Price (₦)</label><input id="itemPrice" type="number" placeholder="50000"></div>
    <div class="form-group"><label>Description</label><textarea id="itemDesc" rows="3" placeholder="Describe your item..."></textarea></div>
    <button id="payListingFeeBtn" class="btn" disabled>Pay ₦100 to Post</button>
  </div>

  <!-- Messages Page -->
  <div id="messages" class="page">
    <div id="chatArea" style="height: 70vh; overflow-y: auto; padding-bottom: 10px;"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="Type a message...">
      <button id="sendMsgBtn">Send</button>
    </div>
  </div>

  <!-- Profile Page -->
  <div id="profile" class="page">
    <div class="profile-card">
      <div id="profileAvatar" style="font-size: 3rem;">👤</div>
      <h3 id="profileName">User</h3>
      <div id="profileStars" class="stars">⭐⭐⭐⭐⭐</div>
      <p id="profileRating">No ratings yet</p>
      <button id="logoutBtn" style="margin-top:20px; background:#c0392b; color:white; border:none; padding:10px 20px; border-radius:8px;">Logout</button>
    </div>
  </div>
</div>

<!-- Paystack inline script -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
  // ---------- Simulated Backend using localStorage ----------
  // Data structures: users, listings, messages, currentUser
  const DB_KEY = 'naijamarket_db';
  let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    users: [],
    listings: [],
    messages: {} // chatId -> array of {from, text, time}
  };

  function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

  let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

  // ---------- Helper Functions ----------
  function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

  function formatPrice(n) { return '₦' + Number(n).toLocaleString(); }

  // ---------- Authentication Simulation ----------
  function ensureUser() {
    if (currentUser) return;
    const name = prompt('Welcome! Enter your name to continue:');
    if (!name) { alert('Name required'); return ensureUser(); }
    const uid = generateId();
    const newUser = {
      uid, name,
      rating: 0, totalRatings: 0,
      bankDetails: { bank: 'Access Bank', accountNumber: '1234567890' } // dummy for subaccount
    };
    db.users.push(newUser);
    currentUser = newUser;
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    saveDB();
  }
  ensureUser();
  // Update profile display
  document.getElementById('profileName').textContent = currentUser.name;
  document.getElementById('profileStars').innerHTML = '⭐'.repeat(Math.round(currentUser.rating || 0)) || 'No ratings';
  document.getElementById('profileRating').textContent = currentUser.rating ? `${currentUser.rating.toFixed(1)} / 5` : 'No ratings';

  // ---------- Render Listings ----------
  function renderHome() {
    const container = document.getElementById('home');
    if (db.listings.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#888;">No listings yet. Be the first to sell!</p>';
      return;
    }
    container.innerHTML = db.listings.filter(l => l.status === 'active').map(listing => `
      <div class="listing">
        <div class="listing-info">
          <h3>${listing.title}</h3>
          <p>${formatPrice(listing.price)} — ${listing.sellerName}</p>
        </div>
        <button class="buy-btn" onclick="buyItem('${listing.id}')" ${listing.sellerId === currentUser.uid ? 'disabled' : ''}>
          ${listing.sellerId === currentUser.uid ? 'Yours' : 'Buy'}
        </button>
      </div>
    `).join('');
  }

  // ---------- Buy Item (via Paystack) ----------
  function buyItem(listingId) {
    const listing = db.listings.find(l => l.id === listingId);
    if (!listing) return;
    const amountInKobo = listing.price * 100; // Paystack uses kobo
    const handler = PaystackPop.setup({
      key: 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', // Replace with your Paystack public key
      email: currentUser.email || 'customer@example.com',
      amount: amountInKobo,
      currency: 'NGN',
      ref: 'TXN_' + generateId(),
      onClose: () => alert('Payment cancelled'),
      callback: function(response) {
        alert('Payment successful! Reference: ' + response.reference);
        // In a real app, verify payment on server, then mark as sold
        listing.status = 'sold';
        saveDB();
        renderHome();
        alert('Item marked as sold. The seller will be notified.');
        // The 3% split would be handled by Paystack subaccount setup on backend.
      }
    });
    handler.openIframe();
  }

  // ---------- Sell Flow: Pay ₦100 listing fee ----------
  document.getElementById('payListingFeeBtn').addEventListener('click', () => {
    const title = document.getElementById('itemTitle').value.trim();
    const price = parseInt(document.getElementById('itemPrice').value);
    const desc = document.getElementById('itemDesc').value.trim();
    if (!title || !price || !desc) return alert('Please fill all fields');

    const handler = PaystackPop.setup({
      key: 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', // Replace with your public key
      email: currentUser.email || 'seller@example.com',
      amount: 10000, // ₦100 in kobo
      currency: 'NGN',
      ref: 'LISTFEE_' + generateId(),
      onClose: () => alert('Listing fee payment cancelled'),
      callback: function(response) {
        // Success: add listing to database
        const newListing = {
          id: generateId(),
          title, price, desc,
          sellerId: currentUser.uid,
          sellerName: currentUser.name,
          status: 'active',
          listingFeePaid: true,
          createdAt: new Date().toISOString()
        };
        db.listings.push(newListing);
        saveDB();
        renderHome();
        document.getElementById('itemTitle').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemDesc').value = '';
        alert('Listing posted successfully!');
      }
    });
    handler.openIframe();
  });

  // Enable sell button only when fields are filled
  document.querySelectorAll('#sell input, #sell textarea').forEach(el => {
    el.addEventListener('input', () => {
      const title = document.getElementById('itemTitle').value.trim();
      const price = document.getElementById('itemPrice').value;
      document.getElementById('payListingFeeBtn').disabled = !(title && price);
    });
  });

  // ---------- Messaging Simulation ----------
  let activeChatId = 'global'; // simple global chat demo
  function renderMessages() {
    const chatArea = document.getElementById('chatArea');
    const msgs = db.messages[activeChatId] || [];
    chatArea.innerHTML = msgs.map(m => {
      const isSent = m.from === currentUser.uid;
      return `<div class="message-bubble ${isSent ? 'message-sent' : 'message-received'}">
        <strong>${m.fromName}:</strong> ${m.text}
      </div>`;
    }).join('');
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  document.getElementById('sendMsgBtn').addEventListener('click', () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    if (!db.messages[activeChatId]) db.messages[activeChatId] = [];
    db.messages[activeChatId].push({
      from: currentUser.uid,
      fromName: currentUser.name,
      text,
      time: Date.now()
    });
    saveDB();
    input.value = '';
    renderMessages();
  });
  // Auto refresh messages (simulate real-time)
  setInterval(renderMessages, 2000);

  // ---------- Tab Navigation ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.page).classList.add('active');
      if (tab.dataset.page === 'home') renderHome();
      if (tab.dataset.page === 'messages') renderMessages();
    });
  });

  // ---------- Logout ----------
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('currentUser');
    currentUser = null;
    location.reload();
  });

  // Initial render
  renderHome();

  // ---------- Note about Paystack keys ----------
  console.log('⚠️ Replace pk_test_xxxxxxxx with your real Paystack public key.');
</script>
</body>
</html>
