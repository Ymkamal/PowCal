<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowCal Floating Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f7;
    }

    /* Floating calculator button */
    .calc-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, #ff8c00, #ff6a00);
      color: #fff;
      border: none;
      padding: 14px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(255, 106, 0, 0.25);
    }

    .calc-toggle:hover {
      transform: translateY(-2px);
    }

    /* Calculator panel */
    .calc-box {
      position: fixed;
      top: 75px;
      right: 20px;
      width: 320px;
      max-width: calc(100vw - 40px);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      display: none;
      z-index: 1000;
      border: 1px solid rgba(255, 140, 0, 0.2);
    }

    .calc-header {
      background: linear-gradient(135deg, #ff8c00, #ff6a00);
      color: white;
      padding: 16px;
      font-weight: bold;
      font-size: 18px;
    }

    .calc-body {
      padding: 16px;
    }

    .total-box {
      background: #fff7ef;
      border-left: 4px solid #ff8c00;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 15px;
      color: #333;
    }

    .total-box strong {
      color: #ff6a00;
    }

    .appliance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .appliance-btn {
      border: none;
      background: #fff3e6;
      color: #ff6a00;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .appliance-btn:hover {
      background: #ff8c00;
      color: #fff;
      transform: translateY(-1px);
    }

    .custom-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .custom-row input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .custom-row button,
    .clear-btn {
      border: none;
      background: #ff6a00;
      color: white;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .clear-btn {
      width: 100%;
      margin-top: 10px;
      background: #333;
    }

    .history {
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 14px;
    }

    .history-item {
      background: #fafafa;
      border: 1px solid #eee;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .small {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <button class="calc-toggle" onclick="toggleCalculator()">⚡ Calculator</button>

  <div class="calc-box" id="calcBox">
    <div class="calc-header">Power Calculator</div>

    <div class="calc-body">
      <div class="total-box">
        Total Energy: <strong><span id="totalWh">0</span> Wh</strong>
        <div class="small">This updates as you add appliances.</div>
      </div>

      <div class="appliance-grid">
        <button class="appliance-btn" onclick="addAppliance('Ceiling Fan', 75)">Fan</button>
        <button class="appliance-btn" onclick="addAppliance('TV', 120)">TV</button>
        <button class="appliance-btn" onclick="addAppliance('Bulb', 10)">Bulb</button>
        <button class="appliance-btn" onclick="addAppliance('Fridge', 150)">Fridge</button>
        <button class="appliance-btn" onclick="addAppliance('Laptop', 65)">Laptop</button>
        <button class="appliance-btn" onclick="addAppliance('Iron', 1000)">Iron</button>
      </div>

      <div class="custom-row">
        <input type="number" id="customWatts" placeholder="Custom watts" min="1" />
        <button onclick="addCustomAppliance()">Add</button>
      </div>

      <div class="history" id="history"></div>

      <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <script>
    let totalWh = 0;
    const history = [];

    function toggleCalculator() {
      const box = document.getElementById("calcBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function addAppliance(name, watts) {
      const hours = prompt(`How many hours do you use ${name}?`);

      if (hours === null) return;

      const h = parseFloat(hours);

      if (isNaN(h) || h <= 0) {
        alert("Please enter a valid number of hours.");
        return;
      }

      const wh = watts * h;
      totalWh += wh;

      history.push({ name, watts, hours: h, wh });
      updateDisplay();
    }

    function addCustomAppliance() {
      const wattsInput = document.getElementById("customWatts");
      const watts = parseFloat(wattsInput.value);

      if (isNaN(watts) || watts <= 0) {
        alert("Please enter a valid watt value.");
        return;
      }

      const name = prompt("Enter appliance name:");
      if (name === null || name.trim() === "") return;

      const hours = prompt(`How many hours do you use ${name.trim()}?`);
      if (hours === null) return;

      const h = parseFloat(hours);

      if (isNaN(h) || h <= 0) {
        alert("Please enter a valid number of hours.");
        return;
      }

      const wh = watts * h;
      totalWh += wh;

      history.push({ name: name.trim(), watts, hours: h, wh });
      wattsInput.value = "";
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById("totalWh").textContent = totalWh.toFixed(2);

      const historyBox = document.getElementById("history");
      historyBox.innerHTML = "";

      history.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <strong>${index + 1}. ${item.name}</strong><br>
          ${item.watts} W × ${item.hours} h = ${item.wh.toFixed(2)} Wh
        `;
        historyBox.appendChild(div);
      });
    }

    function clearAll() {
      totalWh = 0;
      history.length = 0;
      updateDisplay();
    }
  </script>

</body>
</html>
